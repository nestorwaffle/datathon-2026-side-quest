[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devflight"
version = "0.1.0"
description = "Local-first agent memory and offline Math Copilot"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fme-trace = "devflight.cli:main"

[tool.setuptools.packages.find]
include = ["devflight*", "copilot*"]
