[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devflight"
version = "0.2.0"
description = "Durable multi-agent telemetry and Helmcode intelligence backed by RawTree"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
platform = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
fme-trace = "devflight.cli:main"

[tool.setuptools.packages.find]
include = ["devflight*", "copilot*"]

[tool.setuptools.package-data]
devflight = ["web/*.html", "web/assets/*"]
